name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GCP_PROJECT_ID: artictools-e5538
  GCS_BUCKET: artictools-releases
  GCS_RELEASES_PREFIX: artisvn/releases
  GCS_LEGACY_RELEASES_PREFIX: javisvn/releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require tag to match package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform.name }}
    needs: validate-tag
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
            allow_system_svn: ''
          - name: Windows
            os: windows-latest
            args: --win nsis --x64
            allow_system_svn: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Subversion on macOS
        if: runner.os == 'macOS'
        run: brew install subversion

      - name: Install Subversion on Windows
        if: runner.os == 'Windows'
        run: choco install sliksvn -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        shell: bash
        env:
          ARTISVN_ALLOW_SYSTEM_SVN_FOR_BUNDLE: ${{ matrix.platform.allow_system_svn }}
          JAVISVN_ALLOW_SYSTEM_SVN_FOR_BUNDLE: ${{ matrix.platform.allow_system_svn }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --publish never ${{ matrix.platform.args }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub and Cloud Storage release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify macOS and Windows installers
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "release-assets/ArtiSVN-Mac-${version}-Installer.dmg"
          test -f "release-assets/ArtiSVN-Mac-${version}-Installer.zip"
          test -f "release-assets/ArtiSVN-Windows-${version}-Setup.exe"
          test -f "release-assets/latest-mac.yml"
          test -f "release-assets/latest.yml"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArtiSVN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/**/*
          fail_on_unmatched_files: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RELEASES_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare versioned update metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_DIR="${GITHUB_REF_NAME}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const versionDir = process.env.VERSION_DIR;
          const metadataDir = 'release-assets';
          const metadataFiles = fs
            .readdirSync(metadataDir)
            .filter((file) => /^latest.*\.yml$/.test(file));

          if (metadataFiles.length === 0) {
            throw new Error('No update metadata files were found.');
          }

          for (const file of metadataFiles) {
            const filePath = path.join(metadataDir, file);
            const nextContent = fs
              .readFileSync(filePath, 'utf8')
              .replace(/^(\s*(?:- )?(?:url|path):\s*)(?!https?:\/\/|\/)(\S.*)$/gm, (match, prefix, value) => {
                const trimmedValue = value.trim();
                return trimmedValue.startsWith(`${versionDir}/`)
                  ? match
                  : `${prefix}${versionDir}/${trimmedValue}`;
              });
            fs.writeFileSync(filePath, nextContent);
          }
          NODE

      - name: Publish identical release to canonical and legacy channels
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          installer_assets=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
          )
          metadata_assets=(release-assets/latest*.yml)

          if [ "${#installer_assets[@]}" -eq 0 ] || [ "${#metadata_assets[@]}" -eq 0 ]; then
            echo "Installer artifacts or update metadata are missing."
            exit 1
          fi

          for prefix in "${GCS_RELEASES_PREFIX}" "${GCS_LEGACY_RELEASES_PREFIX}"; do
            destination="gs://${GCS_BUCKET}/${prefix}"
            version_destination="${destination}/${GITHUB_REF_NAME}/"

            gcloud storage cp \
              --canned-acl=publicRead \
              --cache-control="public,max-age=31536000,immutable" \
              "${installer_assets[@]}" \
              "${version_destination}"

            gcloud storage cp \
              --canned-acl=publicRead \
              --cache-control="no-cache" \
              "${metadata_assets[@]}" \
              "${destination}/"
          done

      - name: Verify both Cloud Storage channels
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_assets=(
            "${GITHUB_REF_NAME}/ArtiSVN-Mac-${version}-Installer.dmg"
            "${GITHUB_REF_NAME}/ArtiSVN-Mac-${version}-Installer.zip"
            "${GITHUB_REF_NAME}/ArtiSVN-Windows-${version}-Setup.exe"
          )

          for prefix in "${GCS_RELEASES_PREFIX}" "${GCS_LEGACY_RELEASES_PREFIX}"; do
            base_url="https://storage.googleapis.com/${GCS_BUCKET}/${prefix}"

            for expected_asset in "${expected_assets[@]}"; do
              curl --fail --silent --show-error --head "${base_url}/${expected_asset}" >/dev/null
            done

            for metadata in latest.yml latest-mac.yml; do
              metadata_copy="$(mktemp)"
              curl --fail --silent --show-error "${base_url}/${metadata}" --output "${metadata_copy}"

              mapfile -t asset_paths < <(node - "${metadata_copy}" <<'NODE'
          const fs = require('node:fs');
          const metadataPath = process.argv[2];
          const content = fs.readFileSync(metadataPath, 'utf8');
          const paths = new Set();

          for (const match of content.matchAll(/^\s*(?:- )?(?:url|path):\s*(.+)$/gm)) {
            const value = match[1].trim().replace(/^['"]|['"]$/g, '');
            if (value && !/^https?:\/\//i.test(value)) {
              paths.add(value);
            }
          }

          process.stdout.write([...paths].join('\n'));
          NODE
              )

              if [ "${#asset_paths[@]}" -eq 0 ]; then
                echo "No versioned assets found in ${prefix}/${metadata}."
                exit 1
              fi

              for asset_path in "${asset_paths[@]}"; do
                case "${asset_path}" in
                  "${GITHUB_REF_NAME}/"*) ;;
                  *)
                    echo "Metadata ${prefix}/${metadata} does not point to ${GITHUB_REF_NAME}: ${asset_path}"
                    exit 1
                    ;;
                esac
                curl --fail --silent --show-error --head "${base_url}/${asset_path}" >/dev/null
              done
            done
          done
